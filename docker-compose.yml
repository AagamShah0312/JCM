# JCM local stack (spec §60)
#   docker compose up --build
# Services: postgres (pgvector), redis, minio (S3-compatible), backend, celery, frontend
name: jcm

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jcm_db
    environment:
      POSTGRES_DB: ${DB_NAME:-judicial_case_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-judicial_case_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jcm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jcm_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jcmminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-jcmminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jcm_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo || true &&
             python manage.py collectstatic --noinput &&
             gunicorn judicial_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-judicial_case_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-jcm-documents}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-jcmminio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-jcmminio123}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 8

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jcm_celery
    command: celery -A judicial_backend worker -l info
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-change-me}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-judicial_case_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend-next
      dockerfile: ../docker/Dockerfile.frontend-next
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: jcm_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: jcm_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  backend_media:
