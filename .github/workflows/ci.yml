name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django) tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: judicial_case_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: JudicialCaseManagementSystem/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Tesseract OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # Lean test dependency set. Heavy ML packages (sentence-transformers,
      # faiss, pinecone, langchain) are optional lazy imports at runtime and
      # are intentionally not installed here to keep CI fast/reliable.
      - name: Install Python deps (test set)
        run: |
          python -m pip install --upgrade pip
          pip install "Django==4.2.11" "djangorestframework==3.14.0" \
            "djangorestframework-simplejwt==5.3.1" "django-cors-headers==4.3.1" \
            "django-filter==24.1" "django-extensions==3.2.3" "python-decouple==3.8" \
            "Pillow" "requests" "python-multipart" "psycopg2-binary" \
            "google-genai" "celery==5.3.6" "redis==5.0.1" "boto3" "pgvector" \
            "pymupdf" "opencv-python-headless" "pytesseract" "python-docx"

      - name: Django checks
        run: python manage.py check
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: judicial_case_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run tests
        run: python manage.py test
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: judicial_case_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          ALLOWED_HOSTS: localhost,127.0.0.1

  frontend:
    name: Frontend (Next.js) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JudicialCaseManagementSystem/frontend-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JudicialCaseManagementSystem/frontend-next/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build
