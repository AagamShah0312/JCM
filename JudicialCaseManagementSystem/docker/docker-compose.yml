# Docker Compose for JCM (spec §60)
# Services: postgres (pgvector), redis, backend (Django+gunicorn), celery worker,
# frontend (Next.js), nginx.
version: '3.8'

services:
  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: judicial_db
    environment:
      POSTGRES_DB: ${DB_NAME:-judicial_case_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - judicial_network

  # Redis (cache + Celery broker)
  redis:
    image: redis:7-alpine
    container_name: judicial_redis
    ports:
      - "6379:6379"
    networks:
      - judicial_network

  # Django Backend
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: judicial_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn judicial_backend.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-judicial_case_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-False}
    depends_on:
      - db
      - redis
    volumes:
      - ../JudicialCaseManagementSystem/backend:/app
    networks:
      - judicial_network

  # Celery Worker (document pipeline + notifications)
  celery_worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: judicial_celery_worker
    command: celery -A judicial_backend worker -l info
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-judicial_case_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-False}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - judicial_network

  # Next.js Frontend
  frontend:
    build:
      context: ../JudicialCaseManagementSystem/frontend-next
      dockerfile: ../docker/Dockerfile.frontend-next
    container_name: judicial_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - judicial_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: judicial_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - judicial_network

volumes:
  postgres_data:

networks:
  judicial_network:
    driver: bridge
